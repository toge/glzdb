name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux-gcc:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # gcc 16 : Fedora 44
        # gcc 15 : Fedora 43
        fedora_version: ["44", "43"]

    container: fedora:${{ matrix.fedora_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: dnf install -y gcc-c++ cmake ninja-build git curl zip unzip tar

      - name: Check GCC version
        run: |
          g++ --version
          g++ -dumpversion | grep -E "^(1[4-9]|[2-9][0-9])(\.|\$)" || { echo "ERROR: GCC 14+ required, found $(g++ -dumpversion)"; exit 1; }

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ~/vcpkg
            build/vcpkg_installed
          key: ${{ runner.os }}-fedora-${{ matrix.fedora_version }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-fedora-${{ matrix.fedora_version }}-vcpkg-

      - name: Install vcpkg
        run: |
          if [ ! -d ~/vcpkg ]; then
            git clone https://github.com/microsoft/vcpkg.git ~/vcpkg
            ~/vcpkg/bootstrap-vcpkg.sh
          fi

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build -V

  linux-clang:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # clang 22 : Fedora 44
        # clang 21 : Fedora 43
        # clang 20 : Fedora 42
        # clang 19 : Fedora 41
        fedora_version: ["44", "43", "42", "41"]
        exclude:
          # Fedora 41/42 では clang が古すぎる場合はスキップ
          - fedora_version: "41"

    container: fedora:${{ matrix.fedora_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: dnf install -y clang cmake ninja-build git curl zip unzip tar

      - name: Check Clang version
        run: |
          clang++ --version
          clang++ -dumpversion | grep -E "^(1[9]|[2-9][0-9])(\.|\$)" || { echo "ERROR: Clang 19+ required, found $(clang++ -dumpversion)"; exit 1; }

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ~/vcpkg
            build/vcpkg_installed
          key: ${{ runner.os }}-fedora-${{ matrix.fedora_version }}-clang-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-fedora-${{ matrix.fedora_version }}-clang-vcpkg-

      - name: Install vcpkg
        run: |
          if [ ! -d ~/vcpkg ]; then
            git clone https://github.com/microsoft/vcpkg.git ~/vcpkg
            ~/vcpkg/bootstrap-vcpkg.sh
          fi

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build -V

  windows-msvc:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ~/vcpkg
            build/vcpkg_installed
          key: ${{ runner.os }}-msvc-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-msvc-vcpkg-

      - name: Install vcpkg
        run: |
          if (-not (Test-Path ~/vcpkg)) {
            git clone https://github.com/microsoft/vcpkg.git ~/vcpkg
            ~/vcpkg/bootstrap-vcpkg.bat
          }

      - name: Configure
        run: |
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE="$env:USERPROFILE/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release -V

  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ~/vcpkg
            build/vcpkg_installed
          key: ${{ runner.os }}-macos-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-macos-vcpkg-

      - name: Install vcpkg
        run: |
          if [ ! -d ~/vcpkg ]; then
            git clone https://github.com/microsoft/vcpkg.git ~/vcpkg
            ~/vcpkg/bootstrap-vcpkg.sh
          fi

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build -V

  linux-sanitizers:
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: dnf install -y gcc-c++ cmake ninja-build git curl zip unzip tar libasan libubsan

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ~/vcpkg
            build/vcpkg_installed
          key: ${{ runner.os }}-sanitizers-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-sanitizers-vcpkg-

      - name: Install vcpkg
        run: |
          if [ ! -d ~/vcpkg ]; then
            git clone https://github.com/microsoft/vcpkg.git ~/vcpkg
            ~/vcpkg/bootstrap-vcpkg.sh
          fi

      - name: Configure with sanitizers
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build

      - name: Test with sanitizers
        run: |
          export ASAN_OPTIONS=detect_leaks=1:abort_on_error=1
          export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
          ctest --test-dir build -V

  linux-coverage:
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: dnf install -y gcc-c++ cmake ninja-build git curl zip unzip tar lcov

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ~/vcpkg
            build/vcpkg_installed
          key: ${{ runner.os }}-coverage-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-coverage-vcpkg-

      - name: Install vcpkg
        run: |
          if [ ! -d ~/vcpkg ]; then
            git clone https://github.com/microsoft/vcpkg.git ~/vcpkg
            ~/vcpkg/bootstrap-vcpkg.sh
          fi

      - name: Configure with coverage
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_CXX_FLAGS="--coverage -O0" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build -V

      - name: Generate coverage report
        run: |
          lcov --capture --directory build --output-file coverage.info
          lcov --remove coverage.info '/usr/*' --output-file coverage.info
          lcov --list coverage.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.info

  linux-wasip1:
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: dnf install -y cmake ninja-build git curl zip unzip tar gcc-c++ file

      - name: Cache wasi-sdk
        uses: actions/cache@v4
        with:
          path: /opt/wasi-sdk
          key: wasi-sdk-34.0

      - name: Install wasi-sdk
        run: |
          if [ ! -d /opt/wasi-sdk/bin/clang ]; then
            curl -L https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz \
              -o /tmp/wasi-sdk.tar.gz
            mkdir -p /opt/wasi-sdk
            tar -xzf /tmp/wasi-sdk.tar.gz -C /opt/wasi-sdk --strip-components=1
          fi
          /opt/wasi-sdk/bin/clang --version
          /opt/wasi-sdk/bin/clang++ --version

      - name: Cache wasmtime
        uses: actions/cache@v4
        with:
          path: /opt/wasmtime
          key: wasmtime-48.0.1-x86_64-linux

      - name: Install wasmtime
        run: |
          WASMTIME_VERSION=48.0.1
          mkdir -p /opt/wasmtime
          if [ ! -f /opt/wasmtime/wasmtime ]; then
            curl -fsSL "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/wasmtime-v${WASMTIME_VERSION}-x86_64-linux.tar.xz" -o /tmp/wasmtime.tar.xz
            tar -xf /tmp/wasmtime.tar.xz -C /tmp
            cp /tmp/wasmtime-v${WASMTIME_VERSION}-x86_64-linux/wasmtime /opt/wasmtime/
          fi
          echo "/opt/wasmtime" >> $GITHUB_PATH
          /opt/wasmtime/wasmtime --version

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ~/vcpkg
            build/vcpkg_installed
          key: ${{ runner.os }}-wasi-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-wasi-vcpkg-

      - name: Install vcpkg
        run: |
          if [ ! -d ~/vcpkg ]; then
            git clone https://github.com/microsoft/vcpkg.git ~/vcpkg
            ~/vcpkg/bootstrap-vcpkg.sh
          fi

      - name: Build WASI with vcpkg + wasi-sdk (wasm32-wasip1)
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=wasm32-wasip1 \
            -DVCPKG_OVERLAY_TRIPLETS=$PWD/triplets \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=/opt/wasi-sdk/share/cmake/wasi-sdk-p1.cmake
          cmake --build build
          file build/test/smoke_wasi | grep -q WebAssembly

      - name: Test (wasmtime)
        run: ctest --test-dir build -V

  linux-wasip2:
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: dnf install -y cmake ninja-build git curl zip unzip tar gcc-c++ file

      - name: Cache wasi-sdk
        uses: actions/cache@v4
        with:
          path: /opt/wasi-sdk
          key: wasi-sdk-34.0

      - name: Install wasi-sdk
        run: |
          if [ ! -d /opt/wasi-sdk/bin/clang ]; then
            curl -L https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz -o /tmp/wasi-sdk.tar.gz
            mkdir -p /opt/wasi-sdk
            tar -xzf /tmp/wasi-sdk.tar.gz -C /opt/wasi-sdk --strip-components=1
          fi
          /opt/wasi-sdk/bin/clang --version
          /opt/wasi-sdk/bin/clang++ --version

      - name: Cache wasmtime
        uses: actions/cache@v4
        with:
          path: /opt/wasmtime
          key: wasmtime-48.0.1-x86_64-linux

      - name: Install wasmtime
        run: |
          WASMTIME_VERSION=48.0.1
          mkdir -p /opt/wasmtime
          if [ ! -f /opt/wasmtime/wasmtime ]; then
            curl -fsSL "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/wasmtime-v${WASMTIME_VERSION}-x86_64-linux.tar.xz" -o /tmp/wasmtime.tar.xz
            tar -xf /tmp/wasmtime.tar.xz -C /tmp
            cp /tmp/wasmtime-v${WASMTIME_VERSION}-x86_64-linux/wasmtime /opt/wasmtime/
          fi
          echo "/opt/wasmtime" >> $GITHUB_PATH
          /opt/wasmtime/wasmtime --version

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ~/vcpkg
            build/vcpkg_installed
          key: ${{ runner.os }}-wasi-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-wasi-vcpkg-

      - name: Install vcpkg
        run: |
          if [ ! -d ~/vcpkg ]; then
            git clone https://github.com/microsoft/vcpkg.git ~/vcpkg
            ~/vcpkg/bootstrap-vcpkg.sh
          fi

      - name: Build WASI with vcpkg + wasi-sdk (wasm32-wasip2)
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=wasm32-wasip2 \
            -DVCPKG_OVERLAY_TRIPLETS=$PWD/triplets \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=/opt/wasi-sdk/share/cmake/wasi-sdk-p2.cmake
          cmake --build build
          file build/test/smoke_wasi | grep -q WebAssembly

      - name: Test (wasmtime)
        run: ctest --test-dir build -V
